<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient Card Shadow -->
    <filter id="cardShadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.06"/>
    </filter>

    <!-- Mascot Inner Glow & Drop Shadow -->
    <filter id="mascotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4338CA" flood-opacity="0.35"/>
    </filter>

    <!-- Frosted White Squircle Gradient -->
    <linearGradient id="frostedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>

    <!-- Mascot 3D Gradient (Indigo -> Violet -> Emerald Rim) -->
    <radialGradient id="spiritGrad" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="78%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#312E81"/>
    </radialGradient>

    <!-- Gold Coin Gradient -->
    <radialGradient id="coinBadge" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="45%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
  </defs>

  <!-- Frosted Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="106" ry="106" fill="url(#frostedBg)" stroke="#FFFFFF" stroke-width="6" filter="url(#cardShadow)"/>

  <!-- Main Floating Spirit Mascot (Tilted & Playful) -->
  <g filter="url(#mascotGlow)" transform="translate(252, 258) rotate(-8)">
    <!-- Scalloped Ghost/Spirit Body -->
    <path d="M -135 10
             C -140 -95, -75 -155, 10 -150
             C 95 -145, 145 -75, 135 25
             C 130 75, 100 125, 65 130
             C 42 133, 32 115, 15 128
             C -5 142, -32 140, -48 122
             C -62 106, -80 120, -98 108
             C -122 92, -132 55, -135 10 Z"
          fill="url(#spiritGrad)"/>

    <!-- Inner Frosted Highlight -->
    <path d="M -105 -45 C -90 -110, -35 -135, 35 -128" fill="none" stroke="#E0E7FF" stroke-width="10" stroke-linecap="round" opacity="0.45"/>

    <!-- Playful Pill Eyes (Inspired by Image 1) -->
    <rect x="5" y="-58" width="24" height="52" rx="12" transform="rotate(-10 17 -32)" fill="#FFFFFF" opacity="0.95"/>
    <rect x="44" y="-52" width="24" height="52" rx="12" transform="rotate(-10 56 -26)" fill="#FFFFFF" opacity="0.95"/>

    <!-- Cute Hooked Smile (Inspired by Image 1) -->
    <path d="M -48 -12 L -28 -26 C -22 -30, -16 -26, -13 -18 C -4 8, 22 24, 52 18"
          fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>

    <!-- Floating Golden Coin Badge with Upward Arrow / Currency -->
    <g transform="translate(95, 75) rotate(12)">
      <circle cx="0" cy="0" r="46" fill="url(#coinBadge)"/>
      <circle cx="0" cy="0" r="35" fill="none" stroke="#FEF9C3" stroke-width="2.5" opacity="0.8"/>
      <!-- Rising Finance Trend Arrow Inside Coin -->
      <path d="M -16 10 L -3 -3 L 5 5 L 18 -10 M 6 -10 L 18 -10 L 18 2"
            fill="none" stroke="#9A3412" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -16 8 L -3 -5 L 5 3 L 18 -12 M 6 -12 L 18 -12 L 18 0"
            fill="none" stroke="#FEF9C3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
